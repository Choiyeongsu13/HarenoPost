<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Include/head :: head('ポストができました | ハレの日ポスト', ~{::style})}">
  <style>
    .linkbox { display: flex; gap: 8px; }
    .linkbox .input { flex: 1; min-width: 0; font-size: 14px; }
  </style>
</head>
<body>
  <header class="header">
    <a th:href="@{/}" class="logo">ハレの日ポスト</a>
    <nav class="nav"><a th:href="@{/User/user_mypage}" class="btn">マイページ</a></nav>
  </header>

  <main class="page">
    <h1 class="page-title center">ポストができました！</h1>
    <p class="page-lead center">リンクを友だちに送って、カードを集めましょう。</p>
    <div class="panel">
      <label class="muted" for="postUrl">ポストのリンク</label>
      <div class="linkbox" style="margin-top:6px">
        <input class="input" id="postUrl" th:value="${shareUrl}" readonly>
        <button type="button" class="btn btn-sm js-copy" th:attr="data-url=${shareUrl}">コピー</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px">
        <a th:href="@{/Post/post_decorate(code=${post.code})}" class="btn btn-primary btn-lg btn-block">ポストをかざる</a>
        <a th:href="@{/post/{code}(code=${post.code})}" class="btn btn-block">ポストを見る</a>
      </div>
    </div>
  </main>
</body>
</html>
