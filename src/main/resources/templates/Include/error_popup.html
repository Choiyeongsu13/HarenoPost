<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
  <th:block th:fragment="popup(text)">
    <div class="modal open" role="alertdialog" aria-modal="true" aria-labelledby="errorTitle" aria-describedby="errorText">
      <div class="modal-box center">
        <h2 id="errorTitle">お知らせ</h2>
        <p id="errorText" style="margin:0 0 22px;word-break:keep-all" th:text="${text}">エラーが発生しました</p>
        <button type="button" class="btn btn-primary btn-lg btn-block" id="btnBack">OK</button>
      </div>
    </div>
    <script>
      function goBack() {
        // 같은 사이트에서 왔으면 이전 화면, 공유 링크로 바로 들어왔으면 메인
        if (history.length > 1 && document.referrer.indexOf(location.origin) === 0) {
          history.back();
        } else {
          location.href = '/';
        }
      }
      document.getElementById('btnBack').onclick = goBack;
      // Enter, ESC 로도 닫기
      document.onkeydown = function (e) {
        if (e.key === 'Enter' || e.key === 'Escape') { goBack(); }
      };
      document.getElementById('btnBack').focus();
    </script>
  </th:block>
</body>
</html>
