<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Include/head :: head('マイページ | ハレの日ポスト', ~{})}"></head>
<body>
  <header th:replace="~{Include/topmenu :: topmenu}"></header>

  <main class="page-wide">
    <h1 class="page-title">マイページ</h1>
    <p class="page-lead" th:text="|ようこそ、${user.nickname}さん。|">ようこそ。</p>

    <section class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <h2 style="margin:0">プロフィール</h2>
        <a th:href="@{/User/user_modify}" class="btn btn-sm">プロフィール編集</a>
      </div>
      <dl class="profile" style="margin-top:16px">
        <dt>ニックネーム</dt><dd th:text="${user.nickname}"></dd>
        <dt>ID</dt><dd th:text="${user.userid}"></dd>
        <dt>メール</dt><dd th:text="${user.email}"></dd>
        <dt>誕生日</dt><dd th:text="${user.birthday != null} ? ${#temporals.format(user.birthday, 'M月d日')} : '未登録'"></dd>
        <dt>登録日</dt><dd th:text="${user.regdate != null} ? ${#temporals.format(user.regdate, 'yyyy年M月d日')} : ''"></dd>
      </dl>
      <div class="stats">
        <div><b th:text="${postCount}">0</b><span class="muted">つくったポスト</span></div>
        <div><b th:text="${cardCount}">0</b><span class="muted">もらったカード</span></div>
      </div>
    </section>

    <section class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
        <h2 style="margin:0">わたしのポスト</h2>
        <a th:href="@{/Post/post_write}" class="btn btn-primary btn-sm">ポストをつくる</a>
      </div>
      <p class="muted" th:if="${#lists.isEmpty(pList)}">まだポストがありません。「ポストをつくる」から始めましょう。</p>
      <ul class="post-list" th:unless="${#lists.isEmpty(pList)}">
        <li th:each="p : ${pList}">
          <a class="post-item" th:href="@{${p.link}}">
            <span class="mini" th:style="|background:${p.miniColor}|"></span>
            <span class="info">
              <b th:text="${p.title}"></b>
              <span class="muted" th:text="|${p.theme.label} ・ ${#temporals.format(p.openDate, 'yyyy年M月d日 H:mm')} 開封 ・ ${p.cardCount}通|"></span>
            </span>
            <span class="status open" th:if="${p.opened}">開封済み</span>
            <span class="status wait" th:unless="${p.opened}">受付中</span>
          </a>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
