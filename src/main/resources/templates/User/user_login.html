<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Include/head :: head('ログイン | ハレの日ポスト', ~{})}"></head>
<body>
  <header class="header">
    <a th:href="@{/}" class="logo">ハレの日ポスト</a>
  </header>

  <main class="page">
    <h1 class="page-title center">ログイン</h1>
    <p class="page-lead center">ポストをつくるにはログインしてください。</p>

    <form class="panel" id="loginForm" th:action="@{/User/user_login}" method="post" novalidate>
      <p class="msg ok" th:if="${param.joined != null}">登録が完了しました。ログインしてください。</p>
      <p class="msg ok" th:if="${param.logout != null}">ログアウトしました。</p>
      <div class="field">
        <label for="userid">ID</label>
        <input class="input" id="userid" name="userid" autocomplete="username" placeholder="例）yusuke01">
      </div>
      <div class="field">
        <label for="passwd">パスワード</label>
        <input class="input" type="password" id="passwd" name="passwd" autocomplete="current-password">
      </div>
      <p class="msg err" id="loginMsg" role="alert" th:text="${param.error != null} ? 'IDまたはパスワードが正しくありません' : ''"></p>
      <button type="submit" class="btn btn-primary btn-lg btn-block">ログイン</button>

      <div class="divider">はじめての方</div>
      <a th:href="@{/User/user_insert}" class="btn btn-block">新規登録</a>
    </form>
  </main>

  <script>
    $('#loginForm').on('submit', function (e) {
      if (!$('#userid').val() || !$('#passwd').val()) {
        e.preventDefault();
        $('#loginMsg').text('IDとパスワードを入力してください');
      }
    });
  </script>
</body>
</html>
