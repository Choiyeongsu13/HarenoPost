<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('プロフィール編集 | ハレの日ポスト', ~{})}"></head>
<body>
  <header th:replace="~{fragments/header :: header}"></header>

  <main class="page">
    <h1 class="page-title">プロフィール編集</h1>
    <p class="page-lead">メールアドレスを変えるときは、もう一度メール認証が必要です。</p>

    <!-- 프로필 -->
    <form class="panel" id="profileForm" th:action="@{/mypage/edit}" th:object="${profileForm}" method="post" novalidate>
      <h2>プロフィール</h2>
      <p class="msg err" th:each="err : ${#fields.globalErrors()}" th:text="${err}" role="alert"></p>

      <div class="field">
        <label>ID</label>
        <input class="input" th:value="${user.userid}" disabled>
      </div>
      <div class="field">
        <label for="nickname">ニックネーム<span class="req">必須</span></label>
        <input class="input" th:field="*{nickname}" maxlength="10">
        <p class="msg err" th:errors="*{nickname}"></p>
      </div>
      <div class="field">
        <label for="email">メールアドレス<span class="req">必須</span></label>
        <div class="row">
          <input class="input" type="email" th:field="*{email}" autocomplete="email">
          <button type="button" class="btn btn-sm" id="sendCode" style="display:none">認証コード送信</button>
        </div>
        <div class="row" id="codeRow" style="display:none;margin-top:8px">
          <input class="input" id="code" maxlength="6" inputmode="numeric" placeholder="6桁のコード">
          <button type="button" class="btn btn-sm" id="verify">確認</button>
        </div>
        <p class="msg err" id="mailMsg" th:errors="*{email}"></p>
      </div>
      <div class="field">
        <label for="birthday">誕生日<span class="muted">（任意）</span></label>
        <input class="input" type="date" th:field="*{birthday}">
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block" id="saveProfile">保存する</button>
    </form>

    <!-- 패스워드 변경 -->
    <form class="panel" th:action="@{/mypage/password}" th:object="${passwordForm}" method="post" novalidate>
      <h2>パスワード変更</h2>
      <p class="msg err" th:each="err : ${#fields.globalErrors()}" th:text="${err}" role="alert"></p>
      <div class="field">
        <label for="currentPasswd">現在のパスワード</label>
        <input class="input" type="password" th:field="*{currentPasswd}" autocomplete="current-password">
        <p class="msg err" th:errors="*{currentPasswd}"></p>
      </div>
      <div class="field">
        <label for="newPasswd">新しいパスワード</label>
        <input class="input" type="password" th:field="*{newPasswd}" placeholder="英字と数字を含む 8〜20文字" autocomplete="new-password">
        <p class="msg err" th:errors="*{newPasswd}"></p>
      </div>
      <div class="field">
        <label for="newPasswdConfirm">新しいパスワード（確認）</label>
        <input class="input" type="password" th:field="*{newPasswdConfirm}" autocomplete="new-password">
        <p class="msg err" th:errors="*{newPasswdConfirm}"></p>
      </div>
      <button type="submit" class="btn btn-block">パスワードを変更する</button>
    </form>

    <!-- 탈퇴 -->
    <form class="panel" id="withdrawForm" th:action="@{/mypage/withdraw}" th:object="${withdrawForm}" method="post" novalidate>
      <h2>退会</h2>
      <p class="muted">退会すると、つくったポストと届いたカードはすべて削除されます。元に戻せません。</p>
      <p class="msg err" th:each="err : ${#fields.globalErrors()}" th:text="${err}" role="alert"></p>
      <div class="field">
        <label for="withdrawPasswd">パスワード</label>
        <input class="input" type="password" id="withdrawPasswd" name="passwd" autocomplete="current-password">
        <p class="msg err" th:errors="*{passwd}"></p>
      </div>
      <button type="submit" class="btn btn-block">退会する</button>
    </form>

    <p class="center" style="margin-top:20px"><a th:href="@{/mypage}" class="muted">マイページにもどる</a></p>
  </main>

  <script th:inline="javascript">
    var originalEmail = /*[[${user.email}]]*/ '';
    var mailOk = true;
    function show($el, ok, text) { $el.attr('class', ok ? 'msg ok' : 'msg err').text(text); }
    function postJson(url, data) {
      return $.ajax({ url: url, type: 'POST', contentType: 'application/json', data: JSON.stringify(data) });
    }
    function refresh() { $('#saveProfile').prop('disabled', !mailOk); }

    // 메일 주소를 바꿨을 때만 인증 필요
    $('#email').on('input', function () {
      var changed = $.trim($(this).val()) !== originalEmail;
      mailOk = !changed;
      $('#sendCode').toggle(changed);
      $('#codeRow').hide();
      if (changed) { show($('#mailMsg'), false, '新しいメールアドレスの認証をしてください'); } else { $('#mailMsg').text(''); }
      refresh();
    });
    $('#sendCode').on('click', function () {
      var email = $.trim($('#email').val());
      if (!email || !$('#email')[0].checkValidity()) { show($('#mailMsg'), false, 'メールアドレスの形式を確認してください'); return; }
      var $btn = $(this).prop('disabled', true);
      postJson('/api/mail/send', { email: email })
        .done(function (res) { $('#codeRow').show(); $('#code').val('').focus(); show($('#mailMsg'), true, res.message); })
        .fail(function (xhr) { show($('#mailMsg'), false, errMsg(xhr)); })
        .always(function () { $btn.prop('disabled', false); });
    });
    $('#verify').on('click', function () {
      postJson('/api/mail/verify', { email: $.trim($('#email').val()), code: $.trim($('#code').val()) })
        .done(function (res) { mailOk = true; $('#codeRow').hide(); $('#sendCode').hide(); show($('#mailMsg'), true, res.message); refresh(); })
        .fail(function (xhr) { show($('#mailMsg'), false, errMsg(xhr)); });
    });

    $('#withdrawForm').on('submit', function (e) {
      if (!confirm('本当に退会しますか？ポストとカードはすべて削除されます。')) { e.preventDefault(); }
    });
    // 서버 검증 실패로 돌아왔을 때 메일이 바뀐 상태면 다시 인증 버튼을 보여 준다
    if ($.trim($('#email').val()) !== originalEmail) { $('#email').trigger('input'); }
  </script>
</body>
</html>
