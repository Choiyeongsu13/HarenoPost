<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('ハレの日ポスト', ~{::style})}">
  <style>
    .hero { min-height: calc(100vh - 140px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; padding: 24px 20px 40px; }
    .halo { position: relative; width: 320px; height: 360px; display: flex; align-items: flex-end; justify-content: center; }
    .halo::before { content: ""; position: absolute; left: 10px; top: 0; width: 300px; height: 300px; border-radius: 50%; background: #EDE6DA; }
    .hero p { margin: 0; font-size: 18px; }
  </style>
</head>
<body>
  <header th:replace="~{fragments/header :: header}"></header>

  <main class="hero">
    <div class="halo" aria-hidden="true">
      <div class="post post-lg">
        <div class="post-roof"></div>
        <div class="post-body">
          <div class="post-slot"></div>
          <div class="post-tag">
            <svg width="26" height="18" viewBox="0 0 30 22" fill="none" stroke="#C8323C" stroke-width="2.4" stroke-linejoin="round"><rect x="1.5" y="1.5" width="27" height="19" rx="2.5"></rect><path d="M2.5 3 L15 12 L27.5 3"></path></svg>
          </div>
        </div>
        <div class="post-pole"></div>
        <div class="post-base"></div>
      </div>
    </div>
    <div class="center" style="display:flex;flex-direction:column;align-items:center;gap:18px">
      <p>メッセージをあつめて、ハレの日にひらこう。</p>
      <a th:href="@{/post/new}" class="btn btn-primary btn-lg">ポストをつくる</a>
    </div>
  </main>
</body>
</html>
