<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${post.title + ' | ハレの日ポスト'}, ~{::style})}">
  <style>
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 0; }
    .topbar .logo { font-size: 15px; }
    .share { border: 1.5px solid var(--ink); color: var(--ink); }
    .titles { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 8px; text-align: center; }
    .titles h1 { margin: 4px 0 0; font-size: 26px; }
    .titles p { margin: 0; font-size: 14px; }
    .mailbox-area .post { margin-left: 60px; }
    .actions { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; }
    .count { margin: 0; text-align: center; font-size: 14px; }
    .closed { margin: 0; text-align: center; color: var(--sub); font-size: 14px; }
  </style>
</head>
<!-- 카드 본문은 이 화면에 절대 넣지 않는다 (봉투 = 보낸 이름 + 디자인) -->
<body th:class="|theme-${post.theme.key}|">
  <div class="stage">
    <div class="stage-deco" id="bg" aria-hidden="true"></div>

    <div class="stage-inner">
      <div class="topbar">
        <a th:href="@{/}" class="logo">ハレの日ポスト</a>
        <button type="button" class="icon-btn share js-copy" th:attr="data-url=${shareUrl}" aria-label="リンクをシェア">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>
        </button>
      </div>

      <div class="titles">
        <span class="theme-badge" th:text="${post.theme.label}"></span>
        <h1 th:text="${post.title}"></h1>
        <p th:text="|${#temporals.format(post.openDate, 'yyyy年M月d日 H:mm')} に開封|"></p>
      </div>

      <div class="countdown" th:attr="data-open-at=${post.openDateIso}">
        <div><b class="d">0</b><span>日</span></div>
        <div><b class="h">00</b><span>時間</span></div>
        <div><b class="m">00</b><span>分</span></div>
      </div>

      <div class="mailbox-area" id="mailbox">
        <div class="post" id="post">
          <div class="deco-side"></div><div class="deco-top"></div>
          <div class="post-roof"></div>
          <div class="post-body"><div class="post-slot"></div><div class="post-tag" th:text="${post.nameTag != null ? post.nameTag : '　'}"></div></div>
          <div class="deco-front"></div>
          <div class="post-pole"></div><div class="post-base"></div>
        </div>
      </div>

      <p class="count">カードが <b id="cnt" th:text="${#lists.size(envelopes)}">0</b>通 とどいています</p>

      <!-- 주인 -->
      <th:block th:if="${post.owner}">
        <div class="actions" th:unless="${post.opened}">
          <button type="button" class="btn btn-primary btn-lg btn-block js-copy" th:attr="data-url=${shareUrl}">リンクをコピー</button>
          <div class="row">
            <a th:href="@{/post/{code}/decorate(code=${post.code})}" class="btn" style="flex:1">かざる</a>
            <a th:href="@{/post/{code}/edit(code=${post.code})}" class="btn" style="flex:1">設定</a>
          </div>
          <p class="muted center" style="margin:4px 0 0;color:var(--sub)">開封日になると「カードをひらく」ボタンがあらわれます。</p>
        </div>
        <div class="actions" th:if="${post.opened}">
          <a th:href="@{/post/{code}/cards(code=${post.code})}" class="btn btn-primary btn-lg btn-block">カードをひらく</a>
        </div>
      </th:block>

      <!-- 방문자 -->
      <th:block th:unless="${post.owner}">
        <div class="actions" th:unless="${post.opened}">
          <!-- TODO(10/19): 카드 쓰기 모달 + POST /api/posts/{code}/cards -->
          <button type="button" class="btn btn-primary btn-lg btn-block" id="writeBtn">カードを書く</button>
          <button type="button" class="btn btn-block js-copy" th:attr="data-url=${shareUrl}">リンクをコピー</button>
        </div>
        <div class="actions" th:if="${post.opened}">
          <p class="closed">このポストはもう受付を終了しました</p>
        </div>
      </th:block>
    </div>
  </div>

  <script th:src="@{/js/theme-art.js}"></script>
  <script th:inline="javascript">
    var theme = /*[[${post.theme.key}]]*/ 'shogatsu';
    var decos = /*[[${post.decoCodes}]]*/ [];
    // 봉투 목록: 보낸 이름과 디자인 이미지만
    var envelopes = /*[[${envelopeJs}]]*/ [];

    drawBackground($('#bg'), theme);
    drawDecos($('#post'), decos);

    // 봉투 위치 (우체통 주변)
    // ※ "[[" 는 Thymeleaf 인라인 표현식이므로 띄어 쓴다
    var SPOTS = [ [4, 4, -10], [70, 0, 9], [70, 36, -7], [2, 40, 6], [38, 0, -3], [72, 66, 5], [8, 70, 4] ];
    function addEnvelope(name, imageUrl, i, isNew) {
      var s = SPOTS[i % SPOTS.length];
      var $e = $('<div class="envelope" aria-hidden="true"></div>').text(name)
        .css({ left: s[0] + '%', top: s[1] + '%', transform: 'rotate(' + s[2] + 'deg)' })
        .toggleClass('new', !!isNew);
      if (imageUrl) { $e.css('--stamp', 'url("' + encodeURI(imageUrl) + '") center / cover'); }
      $e.appendTo('#mailbox');
    }
    $.each(envelopes, function (i, env) { addEnvelope(env.senderName, env.imageUrl, i); });

    $('#writeBtn').on('click', function () { toast('準備中です'); });
  </script>
</body>
</html>
