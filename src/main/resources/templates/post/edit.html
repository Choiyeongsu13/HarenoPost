<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('ポストの設定 | ハレの日ポスト', ~{::style})}">
  <style>
    .choices { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .choice .ico { height: 48px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <header class="header">
    <a th:href="@{/}" class="logo">ハレの日ポスト</a>
    <nav class="nav"><a th:href="@{/post/{code}(code=${post.code})}" class="btn">ポストにもどる</a></nav>
  </header>

  <main class="page">
    <h1 class="page-title">ポストの設定</h1>
    <p class="page-lead">開封日までは、ポスト名・記念日・開封日を変更できます。</p>

    <form class="panel" id="editForm" th:action="@{/post/{code}/edit(code=${post.code})}" th:object="${form}" method="post" novalidate>
      <p class="msg err" th:each="err : ${#fields.globalErrors()}" th:text="${err}" role="alert"></p>
      <input type="hidden" th:field="*{theme}">

      <div class="field">
        <label for="title">ポスト名<span class="req">必須</span></label>
        <input class="input" th:field="*{title}" maxlength="20">
        <p class="msg err" th:errors="*{title}"></p>
      </div>

      <div class="field">
        <label>記念日<span class="req">必須</span></label>
        <div class="choices" role="radiogroup" aria-label="記念日">
          <button type="button" class="choice" data-theme="shogatsu" role="radio" aria-checked="false"><span class="ico" aria-hidden="true"></span>お正月<small>1月1日</small></button>
          <button type="button" class="choice" data-theme="birthday" role="radio" aria-checked="false"><span class="ico" aria-hidden="true"></span>誕生日<small>登録した誕生日</small></button>
          <button type="button" class="choice" data-theme="christmas" role="radio" aria-checked="false"><span class="ico" aria-hidden="true"></span>クリスマス<small>12月25日</small></button>
        </div>
        <p class="msg err" id="themeNote"></p>
      </div>

      <div class="field">
        <label for="openDate">開封日時<span class="req">必須</span></label>
        <div class="row">
          <input class="input" type="date" th:field="*{openDate}">
          <input class="input" type="time" th:field="*{openTime}" style="max-width:120px">
        </div>
        <p class="muted" id="dateNote"></p>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block">保存する</button>
    </form>

    <section class="panel">
      <h2>ポストを削除</h2>
      <p class="muted">届いたカードもすべて削除されます。元に戻せません。</p>
      <button type="button" class="btn btn-block" data-open="deleteModal">削除する</button>
    </section>
  </main>

  <div class="modal" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
    <form class="modal-box" th:action="@{/post/{code}/delete(code=${post.code})}" method="post">
      <div class="modal-head">
        <h2 id="deleteTitle">ポストを削除しますか？</h2>
        <button type="button" class="icon-btn" data-close aria-label="閉じる"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <p>「<b th:text="${post.title}"></b>」と、届いたカードがすべて削除されます。</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
        <button type="submit" class="btn btn-primary btn-lg btn-block">削除する</button>
        <button type="button" class="btn btn-block" data-close>キャンセル</button>
      </div>
    </form>
  </div>

  <script th:src="@{/js/theme-art.js}"></script>
  <script th:inline="javascript">
    var defaults = /*[[${themeDefaults}]]*/ {};
    var originalTheme = /*[[${post.theme.key}]]*/ 'shogatsu';
    var original = { date: /*[[${#temporals.format(post.openDate, 'yyyy-MM-dd')}]]*/ '', time: /*[[${#temporals.format(post.openDate, 'HH:mm')}]]*/ '00:00' };
    var current = /*[[${#strings.toLowerCase(form.theme)}]]*/ 'shogatsu';

    $('.choice').each(function () { $(this).find('.ico').html(THEME_ICONS[$(this).data('theme')]); });

    function changeTheme(key, keep) {
      var t = THEMES[key];
      $('.choice').removeClass('on').attr('aria-checked', 'false').filter('[data-theme="' + key + '"]').addClass('on').attr('aria-checked', 'true');
      $('#theme').val(key.toUpperCase());
      if (t.fixed) {
        $('#openDate').val(defaults[key].date); $('#openTime').val(defaults[key].time);
      } else if (!keep) {
        // 誕生日: 원래 誕生日 포스트였으면 원래 값, 아니면 다음 생일
        var d = originalTheme === key ? original : defaults[key];
        $('#openDate').val(d.date); $('#openTime').val(d.time);
      }
      $('#openDate, #openTime').prop('disabled', t.fixed);
      $('#dateNote').text(!t.fixed && !$('#openDate').val() ? '誕生日が未登録です。開封日を選んでください（1年以内）。' : t.note);
      $('#themeNote').text(key !== originalTheme ? '記念日を変えると、かざりは初期化されます。' : '');
    }
    $('.choice').on('click', function () { changeTheme($(this).data('theme'), false); });
    changeTheme(current, true);
  </script>
</body>
</html>
