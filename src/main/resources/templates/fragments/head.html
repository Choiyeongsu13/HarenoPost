<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!--
  공통 head. 사용법:
  <head th:replace="~{fragments/head :: head('ログイン | ハレの日ポスト', ~{::style})}">  (페이지 전용 style 이 없으면 ~{})
-->
<head th:fragment="head(title, extra)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">ハレの日ポスト</title>
  <meta name="_csrf" th:content="${_csrf?.token}">
  <meta name="_csrf_header" th:content="${_csrf?.headerName}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <script th:src="@{/js/jquery-3.7.1.min.js}"></script>
  <script th:src="@{/js/common.js}"></script>
  <script>
    // 모든 ajax 에 CSRF 헤더
    $.ajaxSetup({ beforeSend: function (xhr) {
      var header = $('meta[name=_csrf_header]').attr('content');
      if (header) { xhr.setRequestHeader(header, $('meta[name=_csrf]').attr('content')); }
    }});
    // ajax 실패 메시지 (ApiResponse.message)
    function errMsg(xhr) {
      if (xhr.status === 401) { return 'ログインしてください'; }
      return (xhr.responseJSON && xhr.responseJSON.message) || '通信エラーが発生しました';
    }
    function apiError(xhr) { toast(errMsg(xhr)); }
  </script>
  <script th:if="${toast != null}" th:inline="javascript">
    $(function () { toast(/*[[${toast}]]*/ ''); });
  </script>
  <th:block th:replace="${extra}"></th:block>
</head>
</html>
