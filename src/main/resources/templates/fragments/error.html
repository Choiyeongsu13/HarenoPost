<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- 에러 화면 공통: 가운데 우체통 + 문구 -->
<body>
  <main class="page center" th:fragment="error(text)" style="display:flex;flex-direction:column;align-items:center;gap:28px;padding-top:48px">
    <div class="post" aria-hidden="true">
      <div class="post-roof"></div>
      <div class="post-body"><div class="post-slot"></div><div class="post-tag">?</div></div>
      <div class="post-pole"></div>
      <div class="post-base"></div>
    </div>
    <p style="margin:0;font-size:18px" th:text="${text}"></p>
    <a th:href="@{/}" class="btn btn-primary">トップへもどる</a>
  </main>
</body>
</html>
